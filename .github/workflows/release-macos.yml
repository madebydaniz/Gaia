name: Release macOS

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'release' }}
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout branch
        uses: actions/checkout@v4
        if: ${{ github.event_name != 'release' }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Prepare app zip
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release/Gaia.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Gaia.app not found"
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Gaia.app.zip"

      - name: Import signing certificate (optional)
        if: ${{ env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import signing.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign app artifact (optional)
        if: ${{ env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release/Gaia.app" | head -n 1)
          codesign --force --deep --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Gaia.app.zip"

      - name: Notarize app (optional)
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool submit "dist/Gaia.app.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Gaia.dmg
            dist/Gaia.app.zip
          generate_release_notes: true

      - name: Upload artifact
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Gaia-macOS
          path: |
            dist/Gaia.dmg
            dist/Gaia.app.zip
