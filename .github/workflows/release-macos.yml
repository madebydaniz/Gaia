name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach assets to (example: gaia-v0.1.1)"
        required: false
        type: string
  release:
    types:
      - published
  push:
    tags:
      - "gaia-v*"
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.event_name == 'push' && github.ref_name) || '' }}
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import signing certificate (optional)
        if: ${{ env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import signing.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          echo "APP_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build release packages
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            ./scripts/make-dmg.sh
            exit 0
          fi
          if [[ ! "$RELEASE_TAG" =~ ^(gaia-)?v([0-9]+(\.[0-9]+){0,2})$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          version="${BASH_REMATCH[2]}"
          ./scripts/make-dmg.sh "MARKETING_VERSION=$version"

          plist="Gaia.app/Contents/Info.plist"
          unzip -p dist/Gaia.app.zip "$plist" > "$RUNNER_TEMP/zip-info.plist"
          mount="$RUNNER_TEMP/gaia-dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" dist/Gaia.dmg
          trap 'hdiutil detach "$mount"' EXIT
          for file in "$RUNNER_TEMP/zip-info.plist" "$mount/$plist"; do
            actual=$(plutil -extract CFBundleShortVersionString raw "$file")
            if [[ "$actual" != "$version" ]]; then
              echo "::error::$file has version $actual, expected $version"
              exit 1
            fi
          done

      - name: Notarize app (optional)
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool submit "dist/Gaia.app.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload release asset
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/Gaia.dmg
            dist/Gaia.app.zip
          generate_release_notes: true

      - name: Upload artifact
        if: ${{ github.event_name != 'release' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: Gaia-macOS
          path: |
            dist/Gaia.dmg
            dist/Gaia.app.zip
